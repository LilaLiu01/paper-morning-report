name: Morning paper report

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. These entries cover the 8 AM Pacific hour
    # across daylight saving and standard time. Multiple ticks make the job
    # resilient to GitHub's occasional top-of-hour schedule delays or drops;
    # src/main.py exits after one report has been written for the local date.
    - cron: "0,15,30,45 15 * * 2,5"
    - cron: "0,15,30,45 16 * * 2,5"

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build PDF report
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m src.main

      - name: Commit PDF report and seen-paper history
        run: |
          if [ -z "$(git status --porcelain data/seen_papers.json paper_found)" ]; then
            echo "No report or seen-paper history changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_papers.json paper_found
            git commit -m "Add morning paper report"
            git push
          fi
