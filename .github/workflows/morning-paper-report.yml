name: Morning paper report

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. These two entries cover 8 AM Pacific
    # across standard time and daylight saving time. The script exits unless
    # the current America/Los_Angeles time is Tuesday or Friday at 8 AM.
    - cron: "0 15 * * 2,5"
    - cron: "0 16 * * 2,5"

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m src.main

      - name: Commit seen-paper history
        run: |
          if git diff --quiet data/seen_papers.json; then
            echo "No new seen-paper history to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_papers.json
            git commit -m "Update seen paper history"
            git push
          fi
